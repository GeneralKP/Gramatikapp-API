type WritingPractice { configured: Boolean! exercise: WritingExercise }
type WritingExercise {
  id: ID! requestId: String! level: String! model: String! status: String! error: String
  words: [SessionVocabulary!]! sentence: WritingSentence lastAttempt: WritingAttempt createdAt: String!
}
type WritingSentence {
  title: String! spanish: String! german: String mainClause: String subordinateClause: String
  clauseOrder: String! connector: String! grammarExplanation: String spanishWordCount: Int! germanWordCount: Int!
  vocabulary: [VocabularyUsage!]!
}
type WritingAttempt { id: ID! requestId: String! translation: String! status: String! error: String feedback: WritingFeedback }
type WritingFeedback { correct: Boolean! score: Int! summary: String! correctedGerman: String! corrections: [WritingCorrection!]! alternatives: [String!]! }
type WritingCorrection { original: String! corrected: String! explanation: String! category: String! }
type WritingWordHint { word: String! status: String! german: String explanation: String error: String }
extend type Query {
  writingPractice: WritingPractice!
  writingExercise(id: ID!): WritingExercise
  writingWordHint(exerciseId: ID!, word: String!): WritingWordHint
}
extend type Mutation {
  generateWritingExercise(level: String!, requestId: String!): WritingExercise!
  checkWritingTranslation(exerciseId: ID!, translation: String!, requestId: String!): WritingAttempt!
  translateWritingWord(exerciseId: ID!, word: String!): WritingWordHint!
}
