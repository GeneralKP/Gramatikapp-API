type TranslationResult {
  text: String!
  detectedSourceLanguage: String
}

type PerWordExplanation {
  missing: String
  misplaced: String
  misspelled: String
}

type PerWordExplanationEntry {
  key: String!
  value: PerWordExplanation!
}

type NewPhrase {
  id: ID!
  phrase: String!
  synonyms: [String!]
  words: [Word!]!
  perWordExplanation: [PerWordExplanationEntry!]
  level: String
  contexts: [LearningContext!]!
  createdAt: String!
}

type PhraseRelation {
  id: ID!
  main: NewPhrase!
  translated: NewPhrase!
  createdAt: String!
}

extend type Query {
  newPhrases(lang: String!, limit: Int, offset: Int): [NewPhrase!]!
  newPhrase(lang: String!, id: ID!): NewPhrase
  phraseRelations(limit: Int, offset: Int): [PhraseRelation!]!
}

type ImportResult {
  wordsCreated: Int!
  wordsSkipped: Int!
  phrasesCreated: Int!
  phrasesSkipped: Int!
  relationsCreated: Int!
}

extend type Mutation {
  translate(text: String!, targetLang: String): TranslationResult!
  importSeedData(jsonData: String!): ImportResult!
}
