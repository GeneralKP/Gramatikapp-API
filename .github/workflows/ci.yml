name: API checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:anki
      - run: npm run test:scheduler
      - run: npm run test:study-scheduling
      - run: npm run test:contexts
      - run: npm run test:reading-validation
      - run: npm run test:writing-validation
      - run: npx tsx scripts/testLevels.ts --unit
