name: API checks
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:anki
      - run: npm run test:scheduler
      - run: npm run test:study-scheduling
      - run: npm run test:study-sync-validation
      - run: npm run test:contexts
      - run: npm run test:reading-validation
      - run: npm run test:writing-validation
      - run: npm run test:writing-vocabulary -- --unit
      - run: npx tsx scripts/testLevels.ts --unit
      - run: python3 -m unittest discover -s deploy/ovh/tests -v
      - name: Package tested backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf release.tar.gz dist package.json package-lock.json
      - name: Save tested backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ovh-release
          path: release.tar.gz
          retention-days: 7
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gramatik-ovh-production
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ovh-release
      - name: Publish and verify OVH release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publishOvhRelease.mjs
