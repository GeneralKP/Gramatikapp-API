name: API checks
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017', '27037:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:loading
      - run: npm run test:practice-consistency
      - run: npm run test:dashboard-performance
      - run: npm run test:activity
      - run: npx tsx scripts/testDictionaryCatalog.ts
      - run: npx tsx scripts/testReviewedDictionaryCatalog.ts
      - run: npx tsx scripts/testReviewedWordContent.ts
      - run: npx tsx scripts/testReviewedTranslationText.ts
      - run: npm run test:catalog-cache
      - run: npm run test:catalog-signatures
      - run: npm run test:exercise-query-performance
      - run: npm run test:study-account-summary
      - run: npm run test:study-candidate-packing
      - run: npm run test:catalog-anti-joins
      - run: npm run test:phrase-grammar
      - run: npm run test:phrase-grammar-integration
        env:
          MONGODB_URI: mongodb://127.0.0.1:27037/phrase_grammar_fixture
      - run: npm run test:auth
      - run: npm run test:auth-security
      - run: npm run test:model-refactor
      - run: npm run test:anki
      - run: npm run test:scheduler
      - run: npm run test:study-curriculum
      - run: npm run test:study-scheduling
      - run: npm run test:study-sync-validation
      - name: Start isolated review transaction fixture
        run: |
          docker run --rm -d --name temporary-review-mongo --network host mongo:8 mongod --replSet temporaryReviews --bind_ip 127.0.0.1 --port 27019
          for i in $(seq 1 30); do
            docker exec temporary-review-mongo mongosh --port 27019 --quiet --eval 'db.adminCommand({ping:1})' && break || sleep 1
          done
          docker exec temporary-review-mongo mongosh --port 27019 --quiet --eval 'rs.initiate({_id:"temporaryReviews",members:[{_id:0,host:"127.0.0.1:27019"}]})'
          for i in $(seq 1 30); do
            docker exec temporary-review-mongo mongosh --port 27019 --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' && break || sleep 1
          done
      - name: Start isolated article and Again transaction fixture
        run: |
          docker run --rm -d --name study-feature-mongo --network host mongo:8 mongod --replSet studyFeatures --bind_ip 127.0.0.1 --port 27043
          for i in $(seq 1 30); do
            docker exec study-feature-mongo mongosh --port 27043 --quiet --eval 'db.adminCommand({ping:1})' && break || sleep 1
          done
          docker exec study-feature-mongo mongosh --port 27043 --quiet --eval 'rs.initiate({_id:"studyFeatures",members:[{_id:0,host:"127.0.0.1:27043"}]})'
          for i in $(seq 1 30); do
            docker exec study-feature-mongo mongosh --port 27043 --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' && break || sleep 1
          done
      - run: npm run test:article-failures
        env:
          MONGODB_URI: mongodb://127.0.0.1:27043/gramatikapp?replicaSet=studyFeatures
      - run: npm run test:again-pending-integration
        env:
          MONGODB_URI: mongodb://127.0.0.1:27043/gramatikapp?replicaSet=studyFeatures
      - run: npm run test:known
        env:
          KNOWN_FIXTURE_PORT: '27019'
      - run: npm run test:temporary-review-ratings
        env:
          MONGODB_URI: mongodb://127.0.0.1:27019/temporary_review_fixture
      - run: npm run test:practice-consistency-integration
        env:
          MONGODB_URI: mongodb://127.0.0.1:27019/practice_consistency_fixture
      - run: npm run test:card-edits
      - run: npm run test:contexts
      - run: npm run test:reading-validation
      - run: npm run test:writing-validation
      - run: npm run test:writing-vocabulary -- --unit
      - run: npx tsx scripts/testLevels.ts --unit
      - run: python3 -m unittest discover -s deploy/ovh/tests -v
      - name: Package tested backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf release.tar.gz dist package.json package-lock.json
      - name: Save tested backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ovh-release
          path: release.tar.gz
          retention-days: 7
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gramatik-ovh-production
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ovh-release
      - name: Publish and verify OVH release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publishOvhRelease.mjs
